name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Match tag to Cargo version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "rejoin") | .version')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo version $version"
            exit 1
          fi
      - name: Require a GitHub-verified GPG tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq '.object')"
          if [[ "$(jq -r '.type' <<<"$tag_object")" != "tag" ]]; then
            echo "::error::$GITHUB_REF_NAME is not an annotated signed tag"
            exit 1
          fi
          tag_sha="$(jq -r '.sha' <<<"$tag_object")"
          verification="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
            --jq '.verification')"
          if ! jq -e '
            .verified == true and
            (.signature | startswith("-----BEGIN PGP SIGNATURE-----"))
          ' <<<"$verification" >/dev/null; then
            reason="$(jq -r '.reason // "unknown"' <<<"$verification")"
            echo "::error::$GITHUB_REF_NAME is not a verified GPG tag ($reason)"
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build release binary
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked
      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="rejoin-${GITHUB_REF_NAME}-linux-x64.tar.gz"
          mkdir -p dist/package
          cp target/release/rejoin LICENSE README.md CHANGELOG.md dist/package/
          tar -C dist/package -czf "dist/$archive" rejoin LICENSE README.md CHANGELOG.md
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveName = "rejoin-$env:GITHUB_REF_NAME-windows-x64.zip"
          $executableName = "rejoin-$env:GITHUB_REF_NAME-windows-x64.exe"
          $packageDir = Join-Path $PWD 'dist/package'
          $archivePath = Join-Path $PWD "dist/$archiveName"
          $executablePath = Join-Path $PWD "dist/$executableName"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item target/release/rejoin.exe, LICENSE, README.md, CHANGELOG.md -Destination $packageDir
          Copy-Item target/release/rejoin.exe -Destination $executablePath
          Compress-Archive -Path "$packageDir/*" -DestinationPath $archivePath
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/rejoin-*
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ runner.os }}
          path: dist/rejoin-*
          if-no-files-found: error
          retention-days: 7

  installers:
    name: Build and test native installers
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/installers.yml

  publish:
    name: Stage draft GitHub release
    needs: [build, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Download native installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rejoin-installer*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          find dist -maxdepth 1 -type f -name '*.sha256' -delete
          manifest="$(mktemp)"
          trap 'rm -f "$manifest"' EXIT
          (
            cd dist
            find . -maxdepth 1 -type f -printf '%P\0' |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > "$manifest"
            sha256sum --check "$manifest"
          )
          mv "$manifest" dist/SHA256SUMS
          trap - EXIT
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft')" != "true" ]]; then
              echo "::error::Refusing to overwrite a published release"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "rejoin $version" \
              --generate-notes \
              --draft \
              --verify-tag
          fi
