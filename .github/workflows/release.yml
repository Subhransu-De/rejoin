name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Match tag to Cargo version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "rejoin") | .version')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo version $version"
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          archive="rejoin-${GITHUB_REF_NAME}-${host}.tar.gz"
          mkdir -p dist/package
          cp target/release/rejoin LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/$archive" rejoin LICENSE README.md
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$archive" > "$archive.sha256")
          else
            (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          fi
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hostTriple = ((rustc -vV | Select-String '^host: ').Line -replace '^host: ', '')
          $archiveName = "rejoin-$env:GITHUB_REF_NAME-$hostTriple.zip"
          $packageDir = Join-Path $PWD 'dist/package'
          $archivePath = Join-Path $PWD "dist/$archiveName"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item target/release/rejoin.exe, LICENSE, README.md -Destination $packageDir
          Compress-Archive -Path "$packageDir/*" -DestinationPath $archivePath
          $hash = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$archivePath.sha256", "$hash  $archiveName`n")
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: dist/rejoin-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "rejoin $version" \
              --generate-notes \
              --latest \
              --verify-tag
          fi
