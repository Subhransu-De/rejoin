name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hawk:
    name: Hawk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAWK_VERSION: 0.1.9
      HAWK_INSTALLER_SHA256: b92fa35a1e1bb1ac63c6c7b388c4ccd7227b45c20dbdb451758ac3104e4c28a1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install Hawk
        run: |
          installer="$RUNNER_TEMP/cargo-hawk-installer.sh"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" \
            --output "$installer"
          echo "$HAWK_INSTALLER_SHA256  $installer" | sha256sum --check --strict
          sh "$installer"
      - name: Check public Rust API usage
        run: cargo +1.97.1 hawk check --target-dir target/hawk -D warnings

  quality:
    name: Format and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  latest-stable:
    name: Latest stable compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: cargo +stable check --all-targets --all-features --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - run: cargo test --all-targets --all-features --locked
      - run: cargo build --release --locked
