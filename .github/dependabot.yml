version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
      time: "03:00"
      timezone: Asia/Kolkata
    labels:
      - dependencies
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "03:15"
      timezone: Asia/Kolkata
    labels:
      - dependencies
    open-pull-requests-limit: 10
