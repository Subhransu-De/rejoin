[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = [
    { crate = "hashbrown@0.16.1", reason = "Ratatui is transitioning to hashbrown 0.17" },
    { crate = "syn@2.0.119", reason = "Ratatui's macro stack has not moved to syn 3" },
    { crate = "windows-sys@0.60.2", reason = "Arboard has not moved to windows-sys 0.61" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
