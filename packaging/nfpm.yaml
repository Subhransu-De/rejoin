name: rejoin
arch: amd64
platform: linux
version: ${REJOIN_VERSION}
version_schema: semver
release: 1
section: utils
priority: optional
maintainer: rejoin contributors <noreply@github.com>
description: A unified terminal session manager for Claude, Codex, Cursor, Pi, and OpenCode.
vendor: rejoin contributors
homepage: https://github.com/Subhransu-De/rejoin
license: MIT
contents:
  - src: target/release/rejoin
    dst: /usr/bin/rejoin
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/doc/rejoin/LICENSE
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/rejoin/README.md
    file_info:
      mode: 0644
  - src: CHANGELOG.md
    dst: /usr/share/doc/rejoin/CHANGELOG.md
    file_info:
      mode: 0644
overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
  rpm:
    depends:
      - glibc
      - libgcc
rpm:
  summary: Unified terminal session manager for coding agents
  packager: rejoin contributors <noreply@github.com>
