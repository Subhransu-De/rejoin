[package]
name = "rejoin"
version = "0.1.0"
edition = "2024"
description = "A unified terminal session manager for Claude, Codex, Cursor, Pi, and OpenCode"
license = "MIT"
repository = "https://github.com/Subhransu-De/rejoin"
readme = "README.md"
exclude = ["assets/"]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.6.1", default-features = false }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39.6"
unicode-width = "0.2.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
